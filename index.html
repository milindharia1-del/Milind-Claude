<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f0f0f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 1.25rem;
      color: #1a1a1a;
    }

    .add-note {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    textarea {
      width: 100%;
      min-height: 90px;
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
      font-family: inherit;
      resize: vertical;
      background: #fff;
      transition: border-color 0.15s;
    }

    textarea:focus {
      outline: none;
      border-color: #4f6ef7;
    }

    button.add-btn {
      align-self: flex-end;
      padding: 0.5rem 1.25rem;
      background: #4f6ef7;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    button.add-btn:hover { background: #3a57d4; }
    button.add-btn:disabled { background: #a0aee8; cursor: not-allowed; }

    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .empty-state {
      text-align: center;
      color: #888;
      padding: 2rem 0;
      font-size: 0.95rem;
    }

    .note-card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 0.9rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
      animation: fadeIn 0.15s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .note-body {
      flex: 1;
    }

    .note-text {
      font-size: 0.95rem;
      color: #222;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .note-date {
      font-size: 0.75rem;
      color: #999;
      margin-top: 0.4rem;
    }

    button.delete-btn {
      flex-shrink: 0;
      background: none;
      border: none;
      cursor: pointer;
      color: #bbb;
      font-size: 1.1rem;
      line-height: 1;
      padding: 0.1rem 0.3rem;
      border-radius: 4px;
      transition: color 0.15s, background 0.15s;
    }

    button.delete-btn:hover {
      color: #e53e3e;
      background: #fff0f0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Notes</h1>

    <div class="add-note">
      <textarea id="note-input" placeholder="Write a note…" rows="3"></textarea>
      <button class="add-btn" id="add-btn" disabled>Add Note</button>
    </div>

    <div class="notes-list" id="notes-list"></div>
  </div>

  <script>
    const STORAGE_KEY = 'simple-notes';

    const textarea  = document.getElementById('note-input');
    const addBtn    = document.getElementById('add-btn');
    const notesList = document.getElementById('notes-list');

    // Enable button only when there's content
    textarea.addEventListener('input', () => {
      addBtn.disabled = textarea.value.trim() === '';
    });

    // Add note on button click or Ctrl/Cmd+Enter
    addBtn.addEventListener('click', addNote);
    textarea.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') addNote();
    });

    function addNote() {
      const text = textarea.value.trim();
      if (!text) return;

      const note = { id: Date.now(), text, createdAt: new Date().toISOString() };
      const notes = loadNotes();
      notes.unshift(note);
      saveNotes(notes);

      textarea.value = '';
      addBtn.disabled = true;
      textarea.focus();
      render(notes);
    }

    function deleteNote(id) {
      const notes = loadNotes().filter(n => n.id !== id);
      saveNotes(notes);
      render(notes);
    }

    function render(notes) {
      notesList.innerHTML = '';

      if (notes.length === 0) {
        notesList.innerHTML = '<p class="empty-state">No notes yet. Add one above!</p>';
        return;
      }

      notes.forEach(note => {
        const card = document.createElement('div');
        card.className = 'note-card';
        card.dataset.id = note.id;

        const body = document.createElement('div');
        body.className = 'note-body';

        const textEl = document.createElement('p');
        textEl.className = 'note-text';
        textEl.textContent = note.text;

        const dateEl = document.createElement('p');
        dateEl.className = 'note-date';
        dateEl.textContent = formatDate(note.createdAt);

        body.appendChild(textEl);
        body.appendChild(dateEl);

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.title = 'Delete note';
        delBtn.textContent = '✕';
        delBtn.addEventListener('click', () => deleteNote(note.id));

        card.appendChild(body);
        card.appendChild(delBtn);
        notesList.appendChild(card);
      });
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleString(undefined, {
        month: 'short', day: 'numeric', year: 'numeric',
        hour: 'numeric', minute: '2-digit'
      });
    }

    function loadNotes() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { return []; }
    }

    function saveNotes(notes) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    }

    // Initial render
    render(loadNotes());
  </script>
</body>
</html>
