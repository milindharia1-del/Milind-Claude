name: Deploy to Droplet

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node ─────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # ── 3. Install & Build ─────────────────────────────────────────
      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build React app
        run: npm run build
        working-directory: client
        env:
          VITE_API_BASE: ""

      # ── 4. Copy to Droplet via SSH ─────────────────────────────────
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key:      ${{ secrets.DROPLET_SSH_KEY }}
          port:     ${{ secrets.DROPLET_PORT || 22 }}
          script: |
            set -e

            DEPLOY_DIR=/var/www/geowatch

            echo "→ Pulling latest code…"
            cd $DEPLOY_DIR
            git fetch origin main
            git reset --hard origin/main

            echo "→ Installing server dependencies…"
            cd $DEPLOY_DIR/server
            npm ci --omit=dev

            echo "→ Restarting application…"
            cd $DEPLOY_DIR
            pm2 reload ecosystem.config.js --update-env || pm2 start ecosystem.config.js
            pm2 save

            echo "✓ Deployment complete."

      # ── 5. Copy dist separately if needed (rsync fallback) ─────────
      # Uncomment and configure if you prefer rsync over git pull on the server
      # - name: Rsync dist to server
      #   uses: easingthemes/ssh-deploy@main
      #   with:
      #     SSH_PRIVATE_KEY: ${{ secrets.DROPLET_SSH_KEY }}
      #     REMOTE_HOST:     ${{ secrets.DROPLET_HOST }}
      #     REMOTE_USER:     ${{ secrets.DROPLET_USER }}
